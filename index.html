<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch-Dawg AI</title><style>body{margin:0;background:#071015;color:#eef7f2;font-family:system-ui,sans-serif}main{max-width:880px;margin:auto;padding:40px 20px}h1{font-size:clamp(42px,8vw,76px);margin:0}.sub{color:#9fb7aa;line-height:1.6}.card{margin-top:28px;background:#101e1a;border:1px solid #294138;border-radius:20px;padding:22px}textarea{width:100%;min-height:220px;background:#07120f;color:#dff7e9;border:1px solid #294138;border-radius:12px;padding:14px;font:14px ui-monospace,monospace;box-sizing:border-box}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#54e59a;color:#052013;font-weight:800}pre{white-space:pre-wrap;background:#07120f;padding:15px;border-radius:12px;border:1px solid #294138}.good{color:#54e59a}.warn{color:#f0c969}</style></head><body><main><div class="sub">TRANSACTION INTELLIGENCE ENGINE</div><h1>Watch-Dawg AI</h1><p class="sub">Verify the math. Reconcile the ledger. Flag what needs a human. This deterministic prototype is designed as Grow Vault's audit layer.</p><div class="card"><h2>Audit a transaction</h2><textarea id="input">{
  "gross": 500,
  "rate": 0.10,
  "vault": 50,
  "spend": 450
}</textarea><button id="run">Run Watch-Dawg</button><pre id="out">Ready.</pre></div><script type="module">import{auditAllocation}from'./watchdawg.js';const i=document.querySelector('#input'),o=document.querySelector('#out');document.querySelector('#run').onclick=()=>{try{const r=auditAllocation(JSON.parse(i.value));o.textContent=JSON.stringify(r,null,2);o.className=r.status==='VERIFIED'?'good':'warn'}catch(e){o.textContent='Invalid JSON: '+e.message;o.className='warn'}}</script></main></body></html>
