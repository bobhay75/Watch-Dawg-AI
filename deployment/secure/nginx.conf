worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 256; }
http {
    map $uri $safe_route {
        default other;
        /api/health health;
        /api/ai/audit audit;
    }
    log_format private_json escape=json '{"event":"edge_request","timestamp":"$time_iso8601","request_id":"$request_id","route":"$safe_route","status":$status}';
    access_log /dev/stdout private_json;
    server_tokens off;
    client_max_body_size 256k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 5s;
    large_client_header_buffers 4 8k;
    limit_req_zone $binary_remote_addr zone=requests:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    upstream private_backend { server watchdawg_backend:8001; }
    server {
        listen 8443 ssl;
        server_name watchdawg.internal;
        ssl_certificate /run/secrets/server.crt;
        ssl_certificate_key /run/secrets/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        if ($host != watchdawg.internal) { return 421; }
        limit_req zone=requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn connections 16;
        proxy_http_version 1.1;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /run/secrets/backend-ca.crt;
        proxy_ssl_certificate /run/secrets/proxy-client.pem;
        proxy_ssl_certificate_key /run/secrets/proxy-client.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name watchdawg-backend.internal;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Connection '';
        proxy_set_header Host watchdawg.internal;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For '';
        proxy_set_header X-Real-IP '';
        proxy_set_header Forwarded '';
        proxy_set_header X-Request-ID '';
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_next_upstream off;
        proxy_read_timeout 105s;
        location = /api/health { proxy_pass https://private_backend; }
        location = /api/ai/audit { proxy_pass https://private_backend; }
        location / { return 404; }
    }
}
