name: Pilot Website Audit — bobsome1.com

on:
  pull_request:
    paths:
      - ".github/workflows/bobsome1-pilot-audit.yml"
      - "sentinel/browser_capture.py"
      - "sentinel/browser_egress.py"
      - "sentinel/axe_adapter.py"
      - "sentinel/website_audit_bundle.py"
      - "sentinel/site_audit.py"
      - "sentinel/tests/test_site_audit.py"
      - "sentinel/browser/**"
      - "sentinel/audit_tools/**"

permissions:
  contents: read

jobs:
  authorized-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r sentinel/requirements.txt -r sentinel/browser/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix sentinel/audit_tools
          python -m playwright install --with-deps chromium

      - name: Verify multi-page policy classification tests
        run: python -m unittest sentinel.tests.test_site_audit -v

      - name: Run owner-authorized bounded multi-page audit
        id: site_audit
        shell: bash
        run: |
          mkdir -p .pilot/evidence .pilot/site-audit
          set +e
          python -m sentinel.site_audit \
            --site-id bobsome1.com-owner-authorized \
            --evidence-root .pilot/evidence \
            --export .pilot/site-audit \
            --axe-script sentinel/audit_tools/node_modules/axe-core/axe.min.js \
            --url https://bobsome1.com/ \
            --url https://bobsome1.com/book/read/ \
            --url https://bobsome1.com/book/ \
            --url https://bobsome1.com/truth/today.php \
            --url https://bobsome1.com/book/timeline.html \
            --url https://bobsome1.com/book/research.html \
            --url https://bobsome1.com/book/updates.html \
            --url https://bobsome1.com/unveiled/ \
            --url https://bobsome1.com/services/ \
            --url https://bobsome1.com/store/ \
            --url https://bobsome1.com/book/reviews.html \
            --url https://bobsome1.com/book/read/support-right-hand.html \
            | tee .pilot/site-run.json
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f .pilot/site-audit/SITE_AUDIT.md ]]; then
            cat .pilot/site-audit/SITE_AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Verify supply-chain pins
        run: python scripts/verify_supply_chain.py

      - name: Upload owner-authorized site audit packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bobsome1-watch-dawg-site-audit
          path: |
            .pilot/site-audit
            .pilot/site-run.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce complete scoped coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report_path = Path('.pilot/site-audit/SITE_AUDIT.json')
          if not report_path.is_file():
              raise SystemExit('site audit report was not produced')
          report = json.loads(report_path.read_text())
          status = report.get('status')
          print(f"site audit status: {status}")
          print(f"completed pages: {report.get('scope', {}).get('completed_page_count')}")
          print(f"failed pages: {report.get('scope', {}).get('failed_page_count')}")
          if status != 'SITE_REVIEW_READY':
              raise SystemExit('bounded site audit did not complete every explicitly scoped page')
          PY
