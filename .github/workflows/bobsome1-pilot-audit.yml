name: Pilot Website Audit — bobsome1.com

on:
  pull_request:
    paths:
      - ".github/workflows/bobsome1-pilot-audit.yml"
      - "sentinel/browser_capture.py"
      - "sentinel/browser_egress.py"
      - "sentinel/axe_adapter.py"
      - "sentinel/website_audit_bundle.py"
      - "sentinel/browser/**"
      - "sentinel/audit_tools/**"

permissions:
  contents: read

jobs:
  authorized-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r sentinel/requirements.txt -r sentinel/browser/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix sentinel/audit_tools
          python -m playwright install --with-deps chromium

      - name: Capture owner-authorized passive evidence
        run: |
          mkdir -p .pilot/evidence
          python -m sentinel.browser_capture capture \
            --evidence-root .pilot/evidence \
            --target-id bobsome1.com-owner-authorized \
            --url https://bobsome1.com/ \
            --axe-script sentinel/audit_tools/node_modules/axe-core/axe.min.js \
            > .pilot/capture.json
          cat .pilot/capture.json

      - name: Extract evidence references
        id: refs
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path('.pilot/capture.json').read_text())
          if result.get('status') != 'CAPTURED':
              raise SystemExit('capture did not complete')
          package_ref = result['package_ref']
          axe = result.get('derived_analyses', {}).get('axe')
          if not axe or not axe.get('analysis_ref'):
              raise SystemExit('axe analysis reference missing')
          print(f"package_ref={package_ref}")
          print(f"axe_ref={axe['analysis_ref']}")
          PY

      - name: Independently verify browser evidence
        run: |
          python -m sentinel.browser_capture verify \
            --evidence-root .pilot/evidence \
            --package-ref '${{ steps.refs.outputs.package_ref }}' \
            | tee .pilot/browser-verification.json

      - name: Independently verify axe analysis
        run: |
          python - <<'PY' | tee .pilot/axe-verification.json
          import json
          from sentinel.axe_adapter import verify_axe_analysis
          result = verify_axe_analysis('.pilot/evidence', '${{ steps.refs.outputs.axe_ref }}')
          print(json.dumps(result, indent=2, sort_keys=True))
          if result.get('status') != 'VERIFIED_AXE_ANALYSIS':
              raise SystemExit('axe verification failed')
          PY

      - name: Build human-reviewable audit packet
        run: |
          python -m sentinel.website_audit_bundle \
            --evidence-root .pilot/evidence \
            --browser-package-ref '${{ steps.refs.outputs.package_ref }}' \
            --axe-analysis-ref '${{ steps.refs.outputs.axe_ref }}' \
            --export .pilot/audit \
            | tee .pilot/audit-export.json
          cat .pilot/audit/AUDIT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify supply-chain pins
        run: python scripts/verify_supply_chain.py

      - name: Upload owner-authorized pilot packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bobsome1-watch-dawg-pilot-audit
          path: |
            .pilot/audit
            .pilot/capture.json
            .pilot/browser-verification.json
            .pilot/axe-verification.json
            .pilot/audit-export.json
          if-no-files-found: error
          retention-days: 7
