name: KEY-9 Security

on:
  pull_request:
    paths:
      - "key9/**"
      - ".github/workflows/key9-security.yml"
  push:
    branches:
      - key9-contest
    paths:
      - "key9/**"
      - ".github/workflows/key9-security.yml"

permissions:
  contents: read

concurrency:
  group: key9-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Audit Python dependencies
        working-directory: key9/agent-service
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --require-hashes -r requirements.txt
      - name: Run policy and trust-boundary tests
        working-directory: key9/agent-service
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  web-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: key9/package-lock.json
      - name: Install exact web dependencies
        working-directory: key9
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        working-directory: key9
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        working-directory: key9
        run: npm run lint
      - name: Build production bundle
        working-directory: key9
        run: npm run build

  agent-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the Cloud Run image
        run: docker build --tag watch-dawg-key9-agent:test key9/agent-service
      - name: Scan actual KEY-9 OS and vendored Python artifacts
        uses: ./.github/actions/scan-image
        with:
          image: watch-dawg-key9-agent:test
          python-packages: 'true'
      - name: Verify packaged sandbox boundaries without network access
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --entrypoint python \
            -e KEY9_BRIDGE_TOKEN=ci-synthetic-bridge-token \
            -e KEY9_SANDBOX=true watch-dawg-key9-agent:test - <<'PYTHON'
          import os
          from pathlib import Path
          from fastapi.testclient import TestClient
          import main
          assert os.getuid() != 0
          assert {p.name for p in Path('/app').iterdir()} == {
              'main.py', 'requirements.txt', 'agents', 'key9_core'
          }
          assert Path('/app/agents/key9_agent/agent.py').is_file()
          assert not Path('/run/secrets/package_ca').exists()
          import importlib.util
          assert importlib.util.find_spec('pip') is None
          with TestClient(main.app) as client:
              assert client.get('/v1/health').status_code == 200
              assert client.get('/list-apps').status_code == 401
              headers = {'x-key9-bridge-token': 'ci-synthetic-bridge-token'}
              response = client.get('/list-apps', headers=headers)
              assert response.status_code == 200
              assert response.json() == ['key9_agent']
              response = client.post('/v1/approve-export', headers=headers,
                  json={'job_id': 'WD-1042', 'human_approved': False})
              assert response.status_code == 400
              posture = client.get('/v1/security-posture').json()
              assert posture['public_demo_can_relay_owner_approval'] is False
          PYTHON
      - name: Reject production startup without durable session configuration
        run: |
          if docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,noexec,nosuid,size=32m \
              --entrypoint python -e KEY9_SANDBOX=false \
              watch-dawg-key9-agent:test -c 'import main' > refusal.log 2>&1; then
            echo 'Unexpected production startup with process-local sessions' >&2
            exit 1
          fi
          grep -F 'persistent_session_required_outside_sandbox' refusal.log
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit actual Python 3.13 image package inventory
        run: |
          docker run --rm --network none --entrypoint python \
            watch-dawg-key9-agent:test -c "import importlib.metadata as m; [print(d.metadata['Name']+'=='+d.version) for d in m.distributions()]" \
            > "$RUNNER_TEMP/key9-image-requirements.txt"
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps \
            -r "$RUNNER_TEMP/key9-image-requirements.txt"
