name: Validate Watch-Dawg AI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deterministic engine regression tests
        run: npm test
      - name: Frontend server syntax
        run: node --check frontend/server.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline intelligence regressions
        run: python -m unittest discover -s tests -v
      - name: Backend syntax
        run: python -m compileall -q backend
      - name: Install lightweight quality tools
        run: python -m pip install --disable-pip-version-check flake8==7.3.0
      - name: Backend lint
        run: python -m flake8 backend/server.py backend/tests/test_ai_audit_api.py

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hashed backend development lock
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Lint backend and disposable test runner
        run: python -m flake8 backend scripts/test_backend_disposable.py scripts/disposable_images.py scripts/create_backend_security.py scripts/check_image_vulnerabilities.py
      - name: Run all Python suites with real disposable MongoDB
        run: python scripts/test_backend_disposable.py --all-python
      - name: Audit backend runtime and development dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r backend/requirements.txt
          python -m pip_audit -r backend/requirements-dev.txt
      - name: Build private backend container locally
        run: docker build -f backend/Dockerfile -t watchdawg-backend:test .
      - name: Scan backend OS and Python artifacts
        uses: ./.github/actions/scan-image
        with:
          image: watchdawg-backend:test
          python-packages: 'true'
      - name: Verify image contains only runtime Python files
        run: >-
          docker run --rm --entrypoint python watchdawg-backend:test
          -c "from pathlib import Path; assert {p.name for p in Path('/app/backend').iterdir()} == {'server.py', 'providers.py', 'security.py', 'audit.py'}"
      - name: Exercise packaged API with synthetic provider and disposable database
        run: python scripts/test_backend_disposable.py --backend-image watchdawg-backend:test

  operations-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked recovery and test tools
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          python -m pip install --require-hashes -r operations/requirements.txt
      - name: Lint and test offline recovery boundaries
        run: |
          python -m flake8 backend operations scripts/test_operations_disposable.py scripts/disposable_images.py
          python -m pytest operations/tests -q
      - name: Audit operational dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r operations/requirements.txt
      - name: Build isolated backend and TLS proxy (never publish images)
        run: |
          docker build -f backend/Dockerfile -t watchdawg-backend:operations .
          docker build -f deployment/secure/Proxy.Dockerfile -t watchdawg-proxy:operations .
      - name: Scan TLS proxy OS artifacts
        uses: ./.github/actions/scan-image
        with:
          image: watchdawg-proxy:operations
      - name: Synthetic TLS, least privilege, failover and encrypted restore
        run: >-
          python scripts/test_operations_disposable.py
          --backend-image watchdawg-backend:operations
          --proxy-image watchdawg-proxy:operations
      - name: Verify non-root MongoDB server/shell without unused helpers
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint sh \
            watchdawg-mongo:operations -c '
              test "$(id -u)" = 999 &&
              test ! -e /usr/local/bin/gosu &&
              test ! -e /opt/js-yaml &&
              test ! -e /usr/bin/mongodump &&
              command -v mongod && command -v mongosh &&
              mongosh --nodb --quiet --eval "print(1)"
            '
      - name: Scan the exact disposable MongoDB runtime
        uses: ./.github/actions/scan-image
        with:
          image: watchdawg-mongo:operations
