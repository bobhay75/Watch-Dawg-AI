name: Validate Watch-Dawg AI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deterministic engine regression tests
        run: npm test
      - name: Frontend server syntax
        run: node --check frontend/server.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend syntax
        run: python -m compileall -q backend
      - name: Install lightweight quality tools
        run: python -m pip install --disable-pip-version-check flake8==7.3.0
      - name: Backend lint
        run: python -m flake8 backend/server.py backend/tests/test_ai_audit_api.py
