name: Validate Watch-Dawg AI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Deterministic engine regression tests
        run: npm test
      - name: Frontend server syntax
        run: node --check frontend/server.mjs
      - name: Proxy authentication and body limits
        run: node --test frontend/tests/request-boundary.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Backend syntax
        run: python -m compileall -q backend
      - name: API authentication and body limits before parsing
        run: python -m unittest backend.tests.test_request_boundary -v
      - name: Install lightweight quality tools
        run: python -m pip install --disable-pip-version-check flake8==7.3.0
      - name: Backend lint
        run: python -m flake8 backend/server.py backend/request_boundary.py backend/tests
