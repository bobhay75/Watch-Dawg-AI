name: Validate Watch-Dawg Sentinel

on:
  pull_request:
    paths:
      - "sentinel/**"
      - "SENTINEL.md"
      - ".github/workflows/sentinel.yml"
  push:
    branches: [main]
    paths:
      - "sentinel/**"
      - "SENTINEL.md"
      - ".github/workflows/sentinel.yml"

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Sentinel
        run: python -m compileall -q sentinel
      - name: Run Sentinel tests
        run: python -m unittest discover -s sentinel/tests -v

