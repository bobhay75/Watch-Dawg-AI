name: Validate Watch-Dawg Sentinel

on:
  pull_request:
    paths:
      - "sentinel/**"
      - "SENTINEL.md"
      - ".github/workflows/sentinel.yml"
  push:
    branches: [main]
    paths:
      - "sentinel/**"
      - "SENTINEL.md"
      - ".github/workflows/sentinel.yml"

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Sentinel
        run: python -m compileall -q sentinel
      - name: Check staging deployment scripts
        run: bash -n sentinel/scripts/*.sh
      - name: Run Sentinel tests
        run: python -m unittest discover -s sentinel/tests -v
      - name: Build restricted API image
        run: docker build --tag watch-dawg-sentinel-api:test -f sentinel/Dockerfile .
      - name: Verify API fails closed without a bearer token
        run: |
          if output=$(docker run --rm watch-dawg-sentinel-api:test \
            python -c "from sentinel.api import build_service_from_env; build_service_from_env()" 2>&1); then
            echo "API unexpectedly accepted a missing token" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F \
            "SENTINEL_API_TOKEN must contain at least 32 characters"
