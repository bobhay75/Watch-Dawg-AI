name: Verify Emergent routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify live route matrix
        run: npm run verify:emergent-routing -- https://watch-dawg.emergent.host
