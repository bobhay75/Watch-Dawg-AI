name: Build government evaluation evidence

on:
  pull_request:
    paths:
      - "sentinel/**"
      - "scripts/generate_government_evidence.py"
      - "scripts/verify_supply_chain.py"
      - "docs/**"
      - "SECURITY.md"
      - "watchdawg.js"
      - "test.mjs"
      - ".github/workflows/government-evidence.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Sentinel dependencies
        run: python -m pip install --disable-pip-version-check --requirement sentinel/requirements.txt
      - name: Verify source
        run: |
          npm test
          python -m compileall -q sentinel scripts
          python -m unittest discover -s sentinel/tests -v
          bash -n sentinel/scripts/*.sh
          python scripts/verify_supply_chain.py
      - name: Build evidence bundle
        run: python scripts/generate_government_evidence.py --output build/government-evidence
      - name: Upload evaluator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: government-evaluation-evidence-${{ github.sha }}
          path: build/government-evidence
          if-no-files-found: error
          retention-days: 30
